[project]
name = "contra"
version = "0.1.0"
description = "Anti-Forensic Contradiction Engine — autonomous DFIR agent that assumes the evidence is lying."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
contra-mcp = "contra.mcp_server:main"
contra-demo = "contra.demo_offline:main"
contra-evals = "contra.eval.run_evals:main"
contra-report = "contra.report:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
